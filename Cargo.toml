[package]
name = "histogram"
version = "1.5.1-alpha.4"
edition = "2024"
authors = ["Brian Martin <brian@iop.systems>", "Yao Yue <yao@iop.systems>"]
license = "MIT OR Apache-2.0"
description = "A collection of histogram data structures"
homepage = "https://github.com/iopsystems/histogram"
repository = "https://github.com/iopsystems/histogram"
keywords = ["histogram", "metrics", "statistics", "percentile", "hdrhistogram"]
categories = ["data-structures", "algorithms"]
readme = "README.md"
rust-version = "1.85"

[dependencies]
schemars = { version = "1.2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2.0"

[dev-dependencies]
bincode = "1.3.3"
arrow = "58.1.0"
criterion = "0.8"
parquet = "58.1.0"
rand = "0.10"
serde_json = "1"

[features]
schemars = ["dep:schemars", "serde"]
serde = ["dep:serde"]

[[bench]]
name = "histogram"
harness = false

[[bench]]
name = "cumulative_queries"
harness = false

[[bench]]
name = "snapshot_compaction"
harness = false

[[bench]]
name = "cumulative_transforms"
harness = false

[[example]]
name = "rezolus_memory"
path = "examples/rezolus_memory.rs"

[[bench]]
name = "dense_queries"
harness = false

[[bench]]
name = "report_reuse"
harness = false
